name: production

# Build da imagem e smoke de runtime para release/produção.
#
# Enquanto o projeto não tem produção, rode manualmente quando precisar.
# Ao entrar em produção, descomente o gatilho de tag para virar gate de release.
on:
  workflow_dispatch:
  # push:
  #   tags: ["v*"]

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: template-backend-rust:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE: docker compose --project-directory . -f docker/compose.deploy.yml
      POSTGRES_PASSWORD: "ci-app-password"
      APP__DATABASE__URL: "postgres://app:ci-app-password@postgres:5432/app"
      APP__JWT__SECRET: "ci-compose-secret-com-mais-de-32-caracteres"
    steps:
      - uses: actions/checkout@v7

      - name: Valida o compose
        run: $COMPOSE config --quiet

      - name: Sobe infra e aplica migrations
        run: |
          $COMPOSE up -d --build postgres redis
          $COMPOSE --profile tools run --rm --build migrate

      - name: Sobe API e worker
        run: $COMPOSE --profile app up -d --build api worker

      - name: Health, métricas e login
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health/ready > /dev/null; then break; fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8080/health/ready
          curl -fsS http://127.0.0.1:8080/health

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/metrics | grep -q app_email_outbox_pending; then break; fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8080/metrics | grep -E 'axum_http_requests_total|app_email_outbox_pending'

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"ninguem@teste.local","password":"senha-errada-123"}')
          test "$status" = "401"

      - name: Logs em caso de falha
        if: failure()
        run: $COMPOSE --profile app logs --tail=80

      - name: Derruba
        if: always()
        run: $COMPOSE --profile app down -v --remove-orphans
