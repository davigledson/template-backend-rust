name: ci

# PR: só `quality` (feedback rápido).
# main/tag/manual: quality + docker + compose (gate de release).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatação
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Testes
        run: cargo nextest run

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Dependências
        run: cargo deny check

  docker:
    # Build da imagem é caro e não precisa rodar em todo PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: template-backend-rust:ci

  compose:
    # Smoke de runtime com Postgres/Redis reais; fica fora do caminho de PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP__JWT__SECRET: "ci-compose-secret-com-mais-de-32-caracteres"
    steps:
      - uses: actions/checkout@v4

      - name: Valida o compose
        run: docker compose config --quiet

      - name: Sobe infra e aplica migrations
        run: |
          docker compose up -d --build postgres redis
          docker compose --profile tools run --rm migrate

      - name: Sobe API e worker
        run: docker compose --profile app up -d --build api worker

      - name: Health, métricas e login
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health/ready > /dev/null; then break; fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8080/health/ready
          curl -fsS http://127.0.0.1:8080/health

          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/metrics | grep -q app_email_outbox_pending; then break; fi
            sleep 2
          done

          curl -fsS http://127.0.0.1:8080/metrics | grep -E 'axum_http_requests_total|app_email_outbox_pending'

          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"ninguem@teste.local","password":"senha-errada-123"}')
          test "$status" = "401"

      - name: Logs em caso de falha
        if: failure()
        run: docker compose --profile app logs --tail=80

      - name: Derruba
        if: always()
        run: docker compose --profile app down -v --remove-orphans
