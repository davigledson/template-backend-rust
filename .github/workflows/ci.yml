name: ci

# Feedback rápido do desenvolvimento: roda em PR e push.
# Build de imagem e smoke com Docker ficam em production.yml.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatação
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Testes
        run: cargo nextest run

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Dependências
        run: cargo deny check
