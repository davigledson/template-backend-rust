name: smoke

# Smoke pós-deploy: roda contra uma URL real, não contra containers locais.
# Use manualmente ou chame este workflow no pipeline de deploy com a URL do
# ambiente publicado. O mesmo script roda local: `just smoke <url> [token]`.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL base da API (ex.: https://api.exemplo.com)"
        required: true
        type: string
  workflow_call:
    inputs:
      base_url:
        description: "URL base da API"
        required: true
        type: string
    secrets:
      METRICS_TOKEN:
        description: "Bearer do /metrics (obrigatório em produção)"
        required: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BASE_URL: ${{ inputs.base_url }}
      METRICS_TOKEN: ${{ secrets.METRICS_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Smoke
        run: ./scripts/smoke.sh "$BASE_URL" "${METRICS_TOKEN:-}"
