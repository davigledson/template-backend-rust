# Setup scripts ainda são experimentais no nextest; a alternativa (containers
# por teste) custa segundos por teste.
experimental = ["setup-scripts"]

[profile.default]
retries = 1
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
retries = 2
fail-fast = true

[scripts.setup.test-infra]
command = { command-line = "scripts/test-infra.sh", relative-to = "workspace-root" }
capture-stdout = true
slow-timeout = { period = "60s", terminate-after = 5 }

# Só testes de integração precisam de Postgres/Redis; `--lib` continua sem
# containers.
[[profile.default.scripts]]
filter = "kind(test)"
setup = "test-infra"

[[profile.ci.scripts]]
filter = "kind(test)"
setup = "test-infra"
