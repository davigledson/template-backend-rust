name: template-backend-rust-deploy

# Stack de deploy: aplicação + infraestrutura.
# Uso (sempre com --project-directory . para manter o .env e os caminhos da raiz):
#   docker compose --project-directory . -f docker/compose.deploy.yml up -d --build api worker
#   docker compose --project-directory . -f docker/compose.deploy.yml --profile tools run --rm migrate
services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    # Orçamento de 2 vCPU / 2 GB: o Postgres fica com a maior fatia.
    mem_limit: 768m
    cpus: 1.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    mem_limit: 160m
    cpus: 0.5
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["api"]
    mem_limit: 384m
    cpus: 0.9
    environment:
      APP_PROFILE: production
      APP__DATABASE__URL: ${APP__DATABASE__URL:?defina APP__DATABASE__URL}
      APP__REDIS__URL: ${APP__REDIS__URL:-redis://redis:6379}
      APP__JWT__SECRET: ${APP__JWT__SECRET:-}
      APP__MAIL__PROVIDER: ${APP__MAIL__PROVIDER:-log}
      APP__MAIL__FROM: ${APP__MAIL__FROM:-nao-responda@example.com}
      APP__MAIL__SMTP_URL: ${APP__MAIL__SMTP_URL:-}
      APP__SERVER__TRUST_PROXY_HEADERS: ${APP__SERVER__TRUST_PROXY_HEADERS:-false}
      APP__METRICS__TOKEN: ${APP__METRICS__TOKEN:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["worker"]
    mem_limit: 256m
    cpus: 0.5
    environment:
      APP_PROFILE: production
      APP__DATABASE__URL: ${APP__DATABASE__URL:?defina APP__DATABASE__URL}
      APP__REDIS__URL: ${APP__REDIS__URL:-redis://redis:6379}
      APP__JWT__SECRET: ${APP__JWT__SECRET:-}
      APP__MAIL__PROVIDER: ${APP__MAIL__PROVIDER:-log}
      APP__MAIL__FROM: ${APP__MAIL__FROM:-nao-responda@example.com}
      APP__MAIL__SMTP_URL: ${APP__MAIL__SMTP_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 1m

  # Migrations são explícitas: --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["migrator"]
    mem_limit: 384m
    cpus: 0.5
    environment:
      APP_PROFILE: production
      APP__DATABASE__URL: ${APP__DATABASE__URL:?defina APP__DATABASE__URL}
      APP__REDIS__URL: ${APP__REDIS__URL:-redis://redis:6379}
      APP__JWT__SECRET: ${APP__JWT__SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Bootstrap/manutenção: --profile tools run --rm admin create --email ...
  admin:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: docker/Dockerfile
    entrypoint: ["admin"]
    mem_limit: 384m
    cpus: 0.5
    environment:
      APP_PROFILE: production
      APP__DATABASE__URL: ${APP__DATABASE__URL:?defina APP__DATABASE__URL}
      APP__REDIS__URL: ${APP__REDIS__URL:-redis://redis:6379}
      # Só para bootstrap não interativo; fica no ambiente do container.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
