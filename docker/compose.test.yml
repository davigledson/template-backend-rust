name: template-backend-rust-test

# Infra compartilhada dos testes de integração.
#
# O setup script do nextest (`scripts/test-infra.sh`) sobe este compose uma vez
# por `cargo nextest run` e publica TEST_DATABASE_URL/TEST_REDIS_URL. Cada teste
# ganha um banco próprio no Postgres e um DB lógico próprio no Redis
# (`--databases 64`), então dá para rodar em paralelo sem estado compartilhado.
#
# Sem nextest (ex.: `cargo test`), o harness ignora este arquivo e usa
# testcontainers. Para inspecionar o banco à mão:
#   docker compose --project-directory . -f docker/compose.test.yml up -d
#   docker compose --project-directory . -f docker/compose.test.yml down -v
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 12
    tmpfs:
      - /var/lib/postgresql

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
      # DB 0 guarda o contador da alocação; 1..=63 ficam com os testes.
      - --databases
      - "64"
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-56380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
