name: template-backend-rust-test

# Infra opcional para debug manual ou inspeção de um banco de teste.
#
# Os testes normais (`cargo nextest`) usam testcontainers e NÃO leem este
# arquivo. Use este compose quando quiser um Postgres/Redis efêmero fora do
# harness, por exemplo para rodar SQL ou reproduzir um cenário à mão.
#
# Uso:
#   docker compose --project-directory . -f docker/compose.test.yml up -d
#   docker compose --project-directory . -f docker/compose.test.yml down -v
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 12
    tmpfs:
      - /var/lib/postgresql

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-56380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
