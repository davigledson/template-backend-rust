[package]
name = "template-backend-rust"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Template de backend em Rust: Axum + SeaORM + PostgreSQL + Redis (monólito modular)"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[dependencies]
# --- HTTP / runtime ---
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = [
    "catch-panic",
    "compression-full",
    "cors",
    "request-id",
    "timeout",
    "trace",
] }

# --- serialização / validação ---
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_with = "3.25.0"
validator = { version = "0.21.0", features = ["derive"] }
strum = { version = "0.28.0", features = ["derive"] }

# --- OpenAPI ---
utoipa = { version = "6.0.0", features = ["axum_extras", "chrono", "decimal", "uuid"] }
utoipa-axum = "0.3.0"
utoipa-scalar = "0.4.0"

# --- erros ---
thiserror = "2.0.21"
problemdetails = { version = "0.7.0", features = ["axum"] }

# --- observabilidade ---
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
axum-prometheus = "0.10.1"

# --- configuração ---
figment = { version = "0.10.19", features = ["toml", "env"] }
dotenvy = "0.15.7"

# --- banco ---
sea-orm = { version = "2.0.4", features = [
    "macros",
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "with-chrono",
    "with-json",
    "with-rust_decimal",
    "with-uuid",
] }
sea-orm-migration = { version = "2.0.4", features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
] }
uuid = { version = "1.29.3", features = ["serde", "v7"] }
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = { version = "1.43.0", features = ["serde-with-str"] }

# --- cache ---
deadpool-redis = { version = "0.23.1", features = ["rt_tokio_1", "tokio-comp"] }
redis = "1.8.3"

# --- auth ---
jsonwebtoken = { version = "12.0.0", features = ["rust_crypto"] }
argon2 = "0.6.0"
sha2 = "0.11.1"

# --- CLI ---
clap = { version = "4.6.9", features = ["derive"] }
rpassword = "7.5.5"

# --- cron ---
tokio-cron-scheduler = "0.15.1"
chrono-tz = "0.10.4"

[dev-dependencies]
axum-test = "21.1.0"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "redis"] }
insta = { version = "1.49.0", features = ["json"] }
rstest = "0.29.0"
rand = "0.10.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
