# Perfil de desenvolvimento: logs legíveis e CORS liberado para o front local.

[log]
level = "debug"
format = "pretty"
ansi = true

[cors]
allowed_origins = [
    "http://localhost:3000",
    "http://localhost:3010",
    "http://127.0.0.1:3010",
    "http://localhost:5173",
    "http://localhost:4173",
]

[security]
# Desenvolvimento local roda em HTTP; em produção o padrão é true.
cookie_secure = false

[database]
sqlx_logging = false
