# Perfil de produção: logs em JSON, sem ANSI, sem origens locais.
# Segredos e URLs vêm do ambiente (APP__*), nunca deste arquivo.

[log]
level = "info"
format = "json"
ansi = false

[cors]
allowed_origins = []

# Produção não expõe o contrato nem a UI por padrão.
[docs]
enabled = false

[security]
# Só faz efeito quando a API é servida por HTTPS.
hsts_max_age_secs = 31536000

[server]
body_limit_mb = 1
# Dois vCPU no host; deixa folga para o Postgres e o worker.
worker_threads = 2

[database]
sqlx_logging = false
