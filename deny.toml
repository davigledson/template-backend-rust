# Política de dependências — usado por `cargo deny check`.

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

[advisories]
version = 2
yanked = "warn"
# chrono-tz está sem mantenedor (RUSTSEC-2026-0555), mas é dependência do
# tokio-cron-scheduler e não tem substituto direto. Reavalie ao atualizar o cron.
ignore = [
    "RUSTSEC-2026-0543", # chrono sem mantenedor; base de datas do projeto.
    "RUSTSEC-2026-0555", # chrono-tz sem mantenedor; dependência do cron.
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "BSL-1.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
