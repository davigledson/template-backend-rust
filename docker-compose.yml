name: template-backend-rust

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
      # Orçamento para 2 vCPU / 2 GB; ajuste por projeto.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - allkeys-lru
      - --appendonly
      - "no"
      - --save
      - ""
    ports:
      - "127.0.0.1:${REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Aplicação e worker usam a mesma imagem; ative com:
  #   docker compose --profile app up -d
  api:
    profiles: ["app"]
    build: .
    command: ["api"]
    environment:
      APP_PROFILE: production
      APP__DATABASE__URL: postgres://app:app@postgres:5432/app
      APP__REDIS__URL: redis://redis:6379
      APP__JWT__SECRET: ${APP__JWT__SECRET:-}
      APP__MAIL__PROVIDER: ${APP__MAIL__PROVIDER:-log}
      APP__MAIL__FROM: ${APP__MAIL__FROM:-nao-responda@example.com}
      APP__MAIL__SMTP_URL: ${APP__MAIL__SMTP_URL:-}
      APP__SERVER__TRUST_PROXY_HEADERS: ${APP__SERVER__TRUST_PROXY_HEADERS:-false}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ["app"]
    build: .
    command: ["worker"]
    environment:
      APP_PROFILE: production
      APP__DATABASE__URL: postgres://app:app@postgres:5432/app
      APP__REDIS__URL: redis://redis:6379
      APP__JWT__SECRET: ${APP__JWT__SECRET:-}
      APP__MAIL__PROVIDER: ${APP__MAIL__PROVIDER:-log}
      APP__MAIL__FROM: ${APP__MAIL__FROM:-nao-responda@example.com}
      APP__MAIL__SMTP_URL: ${APP__MAIL__SMTP_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Migrations são explícitas: docker compose --profile tools run --rm migrate
  migrate:
    profiles: ["tools"]
    build: .
    command: ["migrator"]
    environment:
      APP_PROFILE: production
      APP__DATABASE__URL: postgres://app:app@postgres:5432/app
      APP__REDIS__URL: redis://redis:6379
      APP__JWT__SECRET: ${APP__JWT__SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
